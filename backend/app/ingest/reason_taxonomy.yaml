# reason_taxonomy.yaml
# Maps raw `reason` values from OMS Data to (reason_code, canonical_reason).
# Keys are lowercase-stripped versions of the raw reason string.
# Groups: DEFECT | DESCRIPTION | FIT_SIZE | PREFERENCE | OTHER | FRAUD | UNKNOWN
#
# Source reference: docs/data_profile.md — "Distinct Values — reason" section.
# This stub maps all 44 observed values documented in the data profile.

mappings:
